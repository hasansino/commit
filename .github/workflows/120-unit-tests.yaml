---

name: unit-tests

# Unit tests.

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      source_sha:
        description: "Commit to test; defaults to the triggering ref"
        required: false
        type: string
        default: ''
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    env:
      MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.tools
      MISE_CACHE_DIR: ${{ github.workspace }}/.tools/cache
      MISE_STATE_DIR: ${{ github.workspace }}/.tools/state
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: 'Setup Go'
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: 'Get Go cache paths'
        id: go-cache
        shell: bash
        run: |
          {
            echo "go-build=$(go env GOCACHE)"
            echo "go-mod=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"
      - name: 'Restore and save Go caches'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        env:
          GO_CACHE_PREFIX: go-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job
            }}
        with:
          path: |
            ${{ steps.go-cache.outputs.go-build }}
            ${{ steps.go-cache.outputs.go-mod }}
          # Refresh per commit and reuse earlier builds from this job.
          key: ${{ env.GO_CACHE_PREFIX }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.GO_CACHE_PREFIX }}-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ env.GO_CACHE_PREFIX }}-
      - name: 'Install pinned Task'
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.9.1'
          install_args: --locked task
      - name: 'Download Go modules'
        run: go mod download
      - name: 'Run unit tests with coverage and race detector'
        run: task test:unit
        env:
          CGO_ENABLED: 1 # needed for -race
      - name: 'Upload coverage reports'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-coverage
          path: |-
            .build/coverage.out
            .build/coverage.html
          include-hidden-files: true
          if-no-files-found: error

---

# Reference:
#   https://taskfile.dev/docs/reference/schema
# JSON schema:
#   https://taskfile.dev/schema.json

# ╭────────────────────----------------──────────╮
# │                     commit                   │
# ╰─────────────────────----------------─────────╯
#
# Before running any commands, ensure following tools are installed:
# - git @see https://git-scm.com/
# - go @see https://go.dev/
# - mise @see https://mise.jdx.dev/
# - task @see https://taskfile.dev/
#
# This file can be executed manually, from CI, by IDE and invoked by AI.
#
# Write all task summaries as multiline literal blocks (summary: |-).
# Keep summary source lines at most 120 characters long, including indentation.

version: '3'

set:
  - errexit
  - pipefail

vars:
  # Relative to the repository root: tasks and CI join it to $PWD or $GITHUB_WORKSPACE.
  BUILD_DIR: .build
  BUILD_BIN_DIR: '{{.BUILD_DIR}}/bin'
  BUILD_DIST_DIR: '{{.BUILD_DIR}}/dist'
  BUILD_REPORTS_DIR: '{{.BUILD_DIR}}/reports'
  BUILD_CACHE_DIR: '{{.BUILD_DIR}}/cache'
  BUILD_TMP_DIR: '{{.BUILD_DIR}}/tmp'

env:
  GOTOOLCHAIN: local
  MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
  MISE_DATA_DIR: '{{.ROOT_DIR}}/.tools'
  MISE_CACHE_DIR: '{{.ROOT_DIR}}/.tools/cache'
  MISE_STATE_DIR: '{{.ROOT_DIR}}/.tools/state'
  TASK_TEMP_DIR: '{{.ROOT_DIR}}/.tools/task'
  BUILD_DIR: '{{.BUILD_DIR}}'
  BUILD_BIN_DIR: '{{.BUILD_BIN_DIR}}'
  BUILD_DIST_DIR: '{{.BUILD_DIST_DIR}}'
  BUILD_REPORTS_DIR: '{{.BUILD_REPORTS_DIR}}'
  BUILD_CACHE_DIR: '{{.BUILD_CACHE_DIR}}'
  BUILD_TMP_DIR: '{{.BUILD_TMP_DIR}}'

tasks:

  help:
    desc: "List available tasks in Taskfile order"
    aliases:
      - default
    cmds:
      - "task --list --sort none"

  env:export:
    desc: "Print the project tooling environment as KEY=value lines"
    summary: |-
      Usage: task env:export
      Prints project variables for CI setup and editor configuration.
    silent: true
    cmds:
      - |
        printf '%s\n' \
          "GOTOOLCHAIN=$GOTOOLCHAIN" \
          "MISE_DEFAULT_CONFIG_FILENAME=$MISE_DEFAULT_CONFIG_FILENAME" \
          "MISE_DATA_DIR=$MISE_DATA_DIR" \
          "MISE_CACHE_DIR=$MISE_CACHE_DIR" \
          "MISE_STATE_DIR=$MISE_STATE_DIR" \
          "TASK_TEMP_DIR=$TASK_TEMP_DIR" \
          "BUILD_DIR=$BUILD_DIR" \
          "BUILD_BIN_DIR=$BUILD_BIN_DIR" \
          "BUILD_DIST_DIR=$BUILD_DIST_DIR" \
          "BUILD_REPORTS_DIR=$BUILD_REPORTS_DIR" \
          "BUILD_CACHE_DIR=$BUILD_CACHE_DIR" \
          "BUILD_TMP_DIR=$BUILD_TMP_DIR"

  # ╭────────────────────----------------──────────╮
  # │                   Tooling                    │
  # ╰─────────────────────----------------─────────╯

  x:
    desc: "Run go42x from the mise-pinned release"
    summary: |-
      Usage: task x [-- COMMAND ...]
    interactive: true
    cmds:
      - 'mise exec -- go42x {{.CLI_ARGS}}'

  x:update:
    desc: "Update go42x and merge bundled assets with project customizations (writes)"
    summary: |-
      Usage: task x:update [VERSION=<version>]
      Defaults to the latest available release. Updates mise, merges released assets, generates agent files,
      and refreshes the knowledge base.
    preconditions:
      - sh: 'test -z {{.CLI_ARGS | shellQuote}}'
        msg: "Pass VERSION=... without arguments after --."
    cmds:
      - |
        version={{.VERSION | default "" | shellQuote}}
        if [ -z "$version" ]; then
          # Resolve new releases without the release-age delay or proxy metadata lag.
          version=$(mise latest --minimum-release-age 0s go42x)
        fi
        if [ -z "$version" ]; then
          printf 'mise did not resolve a go42x release.\n' >&2
          exit 1
        fi

        mkdir -p "$BUILD_TMP_DIR"
        workspace=$(mktemp -d "$PWD/$BUILD_TMP_DIR/go42x-update.XXXXXX")
        printf 'Updating go42x to %s; workspace: %s\n' "$version" "$workspace"
        cp -p etc/mise.toml "$workspace/mise.toml"
        cp -p etc/mise.lock "$workspace/mise.lock"
        restore_pins() {
          cp -p "$workspace/mise.toml" etc/mise.toml
          cp -p "$workspace/mise.lock" etc/mise.lock
          # tool:update removes the replaced version; reinstall it for the restored pin.
          mise install --locked go42x || printf 'Run task setup to reinstall the restored go42x.\n' >&2
          printf 'Restored the previous mise pin and lockfile.\n' >&2
        }

        if ! task tool:update TOOL=go42x "VERSION=$version"; then
          restore_pins
          exit 1
        fi
        if ! task --silent x -- agentenv update --json > "$workspace/update.json"; then
          cat "$workspace/update.json"
          # Restore only when the command reports that no replacements were applied.
          if grep -Eq '"result":null|"applied":0[,}]' "$workspace/update.json"; then
            restore_pins
          fi
          exit 1
        fi
        cat "$workspace/update.json"
      - task: x
        vars:
          CLI_ARGS: 'agentenv generate'
      - task: x
        vars:
          CLI_ARGS: 'kwb build'

  tool:
    desc: "Run a command with the project tools"
    summary: |-
      Usage: task tool -- COMMAND [ARGS...]
    interactive: true
    silent: true
    preconditions:
      - sh: 'test -n {{.CLI_ARGS | shellQuote}}'
        msg: "Usage: task tool -- COMMAND [ARGS...]"
    cmds:
      - 'mise exec -- {{.CLI_ARGS}}'

  tool:update:
    desc: "Set a mise tool dependency to a version (writes)"
    summary: |-
      Usage: task tool:update TOOL=<tool> VERSION=<version>
      Installs the selected tool version, updates etc/mise.toml and etc/mise.lock, and removes its unused versions.
    requires:
      vars:
        - TOOL
        - VERSION
    preconditions:
      - sh: 'test -n {{.TOOL | shellQuote}} && test -n {{.VERSION | shellQuote}}'
        msg: "TOOL and VERSION must not be empty."
      - sh: 'test -z {{.CLI_ARGS | shellQuote}}'
        msg: "Pass TOOL=... VERSION=... without arguments after --."
    cmds:
      - 'mise use --pin -- {{printf "%s@%s" .TOOL .VERSION | shellQuote}}'
      - 'mise lock -- {{.TOOL | shellQuote}}'
      - 'mise prune --tools --yes -- {{.TOOL | shellQuote}}'

  setup:
    desc: "Install pinned project tools and Go modules"
    summary: |-
      Usage: task setup
      Go, mise, and Task must already be installed.
      Then runs setup:tidy, so versions replaced by new pins do not accumulate.
    cmds:
      - "mise install --locked"
      - "go mod download"
      - task: setup:tidy

  setup:release:
    desc: "Install pinned release tools and Go modules"
    summary: |-
      Usage: task setup:release
    cmds:
      - "mise install --locked goreleaser syft cosign"
      - "go mod download"

  setup:tidy:
    desc: "Remove unused tool versions and stale cache files from .tools/ (writes)"
    summary: |-
      Usage: task setup:tidy [DRY_RUN=1]
      Deletes installed versions that no tracked mise configuration selects, then cache files not read within
      cache_prune_age. Versions used by running processes are kept. DRY_RUN=1 lists what would be removed.
    cmds:
      - 'mise prune --tools --yes{{if .DRY_RUN}} --dry-run{{end}}'
      - 'mise cache prune{{if .DRY_RUN}} --dry-run{{end}}'

  # ╭────────────────────----------------──────────╮
  # │                   Testing                    │
  # ╰─────────────────────----------------─────────╯

  test:
    desc: "Run unit and CLI end-to-end tests"
    summary: |-
      Usage: task test
      Runs task test:unit with coverage, then task test:e2e.
    aliases:
      - test:all
    cmds:
      - task: test:unit
      - task: test:e2e

  # @note -count=1 is needed to prevent caching of test results.
  test:unit:
    desc: "Run unit tests with race detection and optional coverage"
    summary: |-
      Usage: task test:unit [-- PACKAGE ...]
      Defaults to the full unit suite with coverage. Explicit local packages skip coverage reports; Go test flags are
      not accepted.
    preconditions:
      - &package_paths
        sh: |
          set -- {{.CLI_ARGS}}
          for package do
            case "$package" in
              ./*) [ ! -d "${package%/...}" ] || continue ;;
            esac
            printf 'Expected a local Go package or subtree: %s\n' "$package" >&2
            exit 2
          done
        msg: "Pass local Go packages after --."
    cmds:
      - |
        set -eo pipefail
        set -- {{.CLI_ARGS}}
        if [ "$#" -gt 0 ]; then
          exec go test -count=1 -race "$@"
        fi

        mkdir -p "$BUILD_REPORTS_DIR"

        unit_packages=$(go list ./...)
        unit_exclude_pattern=$(printf '%s\n' mocks tests | paste -sd '|' -)
        unit_packages=$(printf '%s\n' "$unit_packages" | grep -vE "/($unit_exclude_pattern)(/|$)")

        # go list returns separate package names; preserve word splitting here.
        # shellcheck disable=SC2086
        go test -count=1 -v -race -covermode=atomic \
          -coverpkg="$(printf '%s\n' "$unit_packages" | paste -sd, -)" \
          -coverprofile="$BUILD_REPORTS_DIR/coverage.out" $unit_packages \
          | sed -E 's/(coverage: [0-9.]+% of statements) in .*/\1/'

        go tool cover -html="$BUILD_REPORTS_DIR/coverage.out" -o="$BUILD_REPORTS_DIR/coverage.html"
        go tool cover -func="$BUILD_REPORTS_DIR/coverage.out" | grep '^total:'

  test:e2e:
    desc: "Run CLI tests with race detection in isolated Git repositories"
    summary: |-
      Usage: task test:e2e [E2E_TIMEOUT=5m]
      Builds the CLI once with race detection. Set COMMIT_RELEASE_DIST to test a release bundle instead; prefer
      task test:release for that.
    cmds:
      - >-
        go run github.com/onsi/ginkgo/v2/ginkgo --race --procs=4 --randomize-all --fail-on-pending --fail-on-empty --trace
        --timeout={{.E2E_TIMEOUT | default "5m" | shellQuote}} ./tests/e2e

  test:release:
    desc: "Verify release artifacts and test the native packaged CLI"
    summary: |-
      Usage: task test:release [COMMIT_RELEASE_DIST=<dir>]
      Defaults to BUILD_DIST_DIR. Create artifacts first with task release:snapshot. Relative paths resolve from the
      repository root.
    env:
      COMMIT_RELEASE_DIST: '{{.COMMIT_RELEASE_DIST | default .BUILD_DIST_DIR}}'
    cmds:
      - task: test:e2e
        vars:
          # Allow the full suite to finish on slower native macOS Intel runners.
          E2E_TIMEOUT: '{{.E2E_TIMEOUT | default "10m"}}'

  # ╭────────────────────----------------──────────╮
  # │               General workflow               │
  # ╰─────────────────────----------------─────────╯

  # `-N -l` disables compiler optimizations and inlining, which makes debugging easier.
  run:
    desc: "Run the application from source"
    summary: |-
      Usage: task run [-- APP_ARGS...]
    interactive: true
    cmds:
      - >-
        go run -gcflags="all=-N -l" -race
        . {{.CLI_ARGS}}

  debug:
    desc: "Run the application with the Delve debugger"
    summary: |-
      Usage: task debug [-- APP_ARGS...]
      Connect your debugger to localhost:2345.
    interactive: true
    cmds:
      - 'mkdir -p "$BUILD_BIN_DIR"'
      - >-
        mise exec -- dlv debug .
        --headless --listen=127.0.0.1:2345 --accept-multiclient --api-version=2
        --output="$BUILD_BIN_DIR/commit-debug" -- {{.CLI_ARGS}}

  build:
    desc: "Build a development binary in BUILD_BIN_DIR"
    summary: |-
      Usage: task build [-- BUILD_FLAGS...]
      Builds with race detection and compiler optimizations disabled.
    cmds:
      - 'mkdir -p "$BUILD_BIN_DIR"'
      - >-
        go build -gcflags="all=-N -l" -race -v
        {{.CLI_ARGS}} -o "$BUILD_BIN_DIR/commit" .

  generate:code:
    desc: "Regenerate code and tidy Go dependencies"
    summary: |-
      Usage: task generate:code
      Updates generated files and Go module metadata.
    cmds:
      - "go mod tidy"
      - "go generate ./..."

  # ╭────────────────────----------------──────────╮
  # │                  Formatters                  │
  # ╰─────────────────────----------------─────────╯

  fmt:go:
    desc: "Format explicit Go source files (writes)"
    summary: |-
      Usage: task fmt:go -- FILE.go [FILE.go ...]
    preconditions: &files
      - sh: |
          set -- {{.CLI_ARGS}}
          [ "$#" -gt 0 ]
        msg: "Pass explicit file paths after --."
      - &file_paths
        sh: |
          set -- {{.CLI_ARGS}}
          for file do
            case "$file" in
              -*|!*|*\**|*\?*|*\[*|*\]*|*\{*|*\}*) printf 'Expected a literal file path: %s\n' "$file" >&2; exit 2 ;;
            esac
            [ -f "$file" ] || { printf 'Expected an existing file: %s\n' "$file" >&2; exit 2; }
          done
        msg: "Pass explicit existing file paths after --."
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        mise exec -- golangci-lint fmt --config etc/golangci.yml "$@"

  fmt:yaml:
    desc: "Format explicit plain YAML files (writes)"
    summary: |-
      Usage: task fmt:yaml -- FILE.yaml [FILE.yaml ...]
    preconditions: *files
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        mise exec -- yamlfmt -conf etc/yamlfmt.yaml "$@"

  fmt:json:
    desc: "Format explicit JSON files (writes)"
    summary: |-
      Usage: task fmt:json -- FILE.json [FILE.json ...]
    preconditions: *files
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        mise exec -- jsonfmt -w "$@"

  fmt:toml:
    desc: "Format explicit TOML files (writes)"
    summary: |-
      Usage: task fmt:toml -- FILE.toml [FILE.toml ...]
    preconditions: *files
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        for file do
          case "$file" in
            /*) ;;
            *) file="$PWD/$file" ;;
          esac
          # Tombi discovers etc/tombi.toml from its working directory.
          (cd etc && mise exec -- tombi format --offline "$file")
        done

  # ╭────────────────────----------------──────────╮
  # │                   Linters                    │
  # ╰─────────────────────----------------─────────╯

  lint:
    desc: "Run code, configuration, and workflow linters"
    summary: |-
      Usage: task lint
      Accepts no arguments; use a lint:* task to select files or packages.
    preconditions:
      - sh: |
          set -- {{.CLI_ARGS}}
          [ "$#" -eq 0 ]
        msg: "Use a lint:* task for file or package arguments."
    cmds:
      - task: "lint:go"
      - task: "lint:gosec"
      - task: "lint:vulnerabilities"
      - task: "lint:secrets"
      - task: "lint:json"
      - task: "lint:yaml"
      - task: "lint:toml"
      - task: "lint:actions"
      - task: "lint:editorconfig"

  lint:go:
    desc: "Lint all Go packages, or explicit local packages and subtrees (read only)"
    summary: |-
      Usage: task lint:go [-- ./internal/cli ./pkg/commit/...]
    preconditions:
      - *package_paths
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        mise exec -- golangci-lint config verify --config etc/golangci.yml
        mise exec -- golangci-lint run --config etc/golangci.yml "$@"

  lint:nilaway:
    desc: "Check all Go packages for potential nil panics with NilAway (advisory; not part of lint)"
    cmds:
      - |
        go vet -vettool="$(mise which nilaway)" \
          -include-pkgs=github.com/hasansino/commit \
          -exclude-file-docstrings='Code generated' \
          -include-errors-in-files="$(pwd -P)" \
          -pretty-print=false \
          -print-full-file-path=true \
          ./...

  lint:gosec:
    desc: "Check Go code with gosec"
    vars:
      PACKAGE_DIRS:
        sh: go list -f '{{"{{"}}.Dir{{"}}"}}' ./...
    cmds:
      - |
        set -- {{range splitList "\n" .PACKAGE_DIRS}}{{if .}}{{. | shellQuote}} {{end}}{{end}}
        mise exec -- gosec -terse -exclude-generated "$@"

  lint:vulnerabilities:
    desc: "Check CLI vulnerabilities for all release platforms"
    cmds:
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=amd64 mise exec -- govulncheck .'
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=arm64 mise exec -- govulncheck .'
      - 'CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 mise exec -- govulncheck .'
      - 'CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 mise exec -- govulncheck .'

  lint:secrets:
    desc: "Scan Git history, or explicit files, for secrets with Gitleaks"
    summary: |-
      Usage: task lint:secrets [-- FILE ...]
      Defaults to Git history. Explicit files are scanned directly, including ignored and untracked files.
      Findings are redacted; secret findings and scanner errors fail the task.
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        if [ "$#" -eq 0 ]; then
          mise exec -- gitleaks git --config etc/gitleaks.toml --no-banner --redact -v
        else
          for file do
            printf 'Scanning %s for secrets\n' "$file"
            mise exec -- gitleaks stdin --config etc/gitleaks.toml --no-banner --redact < "$file"
          done
        fi

  lint:actions:
    desc: "Check all GitHub Actions, or explicit workflow files (read only)"
    summary: |-
      Usage: task lint:actions [-- .github/workflows/FILE.yaml ...]
      Defaults include composite actions in Zizmor.
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        mise exec -- actionlint -oneline "$@"
        if [ "$#" -eq 0 ]; then set -- .; fi
        mise exec -- zizmor -q --persona regular --min-severity high --min-confidence high \
          --offline --format plain --color never --no-progress "$@"

  lint:editorconfig:
    desc: "Check EditorConfig rules for the project, or explicit files (read only)"
    summary: |-
      Usage: task lint:editorconfig [-- FILE ...]
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        mise exec -- editorconfig-checker -config etc/editorconfig.json "$@"

  lint:yaml:
    desc: "Check plain YAML source formatting, or explicit files (read only)"
    summary: |-
      Usage: task lint:yaml [-- FILE.yaml ...]
      Defaults to Git source YAML files.
    vars:
      SOURCE_FILES:
        sh: |
          {{if not .CLI_ARGS}}
          git ls-files --cached --others --exclude-standard -z -- '*.yaml' '*.yml'
          {{end}}
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{range splitList "\x00" .SOURCE_FILES}}{{if .}}{{. | shellQuote}} {{end}}{{end}}{{end}}
        for file do
          if [ -f "$file" ]; then
            mise exec -- yamlfmt -conf etc/yamlfmt.yaml -lint "$file"
          fi
        done

  lint:json:
    desc: "Check JSON source formatting, or explicit files (read only)"
    summary: |-
      Usage: task lint:json [-- FILE.json ...]
      Defaults exclude package-lock.json.
    vars:
      SOURCE_FILES:
        sh: |
          {{if not .CLI_ARGS}}
          git ls-files --cached --others --exclude-standard -z -- '*.json' ':!:**/package-lock.json'
          {{end}}
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{range splitList "\x00" .SOURCE_FILES}}{{if .}}{{. | shellQuote}} {{end}}{{end}}{{end}}
        for file do
          if [ -f "$file" ]; then
            mise exec -- jsonfmt "$file"
          fi
        done

  lint:toml:
    desc: "Check TOML source formatting and lint rules, or explicit files (read only)"
    summary: |-
      Usage: task lint:toml [-- FILE.toml ...]
      Defaults to Git source files ending in .toml.
    vars:
      SOURCE_FILES:
        sh: |
          {{if not .CLI_ARGS}}
          git ls-files --cached --others --exclude-standard -z -- '*.toml'
          {{end}}
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{range splitList "\x00" .SOURCE_FILES}}{{if .}}{{. | shellQuote}} {{end}}{{end}}{{end}}
        for file do
          if [ -f "$file" ]; then
            case "$file" in
              /*) ;;
              *) file="$PWD/$file" ;;
            esac
            # Tombi discovers etc/tombi.toml from its working directory.
            (
              cd etc
              mise exec -- tombi format --offline --check "$file"
              mise exec -- tombi lint --offline --error-on-warnings "$file"
            )
          fi
        done

  # ╭────────────────────----------------──────────╮
  # │                   Release                    │
  # ╰─────────────────────----------------─────────╯

  release:check:
    desc: "Validate GoReleaser configuration"
    cmds:
      - 'mise exec -- goreleaser check --config etc/goreleaser.yaml'

  release:snapshot:
    desc: "Build release artifacts without publishing or signing"
    summary: |-
      Usage: task release:snapshot
      Run task setup:release first; writes unsigned snapshot artifacts to BUILD_DIST_DIR.
    cmds:
      - 'mise exec -- goreleaser release --config etc/goreleaser.yaml --snapshot --clean --skip=publish,sign'

  release:local:
    desc: "Build and sign a tagged release without publishing"
    summary: |-
      Usage: task release:local
      Run task setup:release first; requires a release tag and Cosign authentication. Writes signed artifacts to
      BUILD_DIST_DIR.
    cmds:
      - 'mise exec -- goreleaser release --config etc/goreleaser.yaml --clean --skip=publish'

  release:
    desc: "Build, sign, and publish a release (CI only)"
    summary: |-
      Usage: task release
      Invoked by the release workflow with a validated tag and release credentials; requires GITHUB_ACTIONS=true.
    preconditions:
      - sh: '[ "$GITHUB_ACTIONS" = "true" ]'
        msg: "Dispatch the release workflow from master to publish a release."
    cmds:
      - 'mise exec -- goreleaser release --config etc/goreleaser.yaml --clean'

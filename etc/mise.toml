min_version = "2026.10.21"

[settings]
lockfile = true
exec_auto_install = false
disable_update_warning = true
# Downloads are cached per project under .tools/cache; keep enough for reinstalls, not the 2GiB default.
download_cache_max_size = "512MiB"

[env]
GOTOOLCHAIN = "local"

[tool_alias]
dlv = "aqua:go-delve/delve"
go42x = "github:go42-dev/go42x"
gopls = "go:golang.org/x/tools/gopls"
gosec = "aqua:securego/gosec"
govulncheck = "go:golang.org/x/vuln/cmd/govulncheck"
jsonfmt = "github:caarlos0/jsonfmt"
nilaway = "go:go.uber.org/nilaway/cmd/nilaway"
yamlfmt = "aqua:google/yamlfmt"

[tools]
actionlint = "1.7.12"
editorconfig-checker = "4.0.2"
gitleaks = "8.30.1"
golangci-lint = "2.15.0"
tombi = "1.11.1"
zizmor = "1.32.0"
goreleaser = "2.20.0"
syft = "1.57.1"
cosign = "3.1.4"
yamlfmt = "0.21.0"
dlv = "1.27.2"
gosec = "2.30.0"
nilaway = "v0.0.0-20260918162853-acb8859b9031"
gopls = "0.24.0"
govulncheck = "1.9.0"
jsonfmt = "0.5.2"
go42x = "0.62.1"
